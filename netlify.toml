[build]
  command = "npm install --include=dev --no-audit --no-fund && npm run build"
  publish = "dist/client"
  functions = "dist/server"

[dev]
  command = "npm run dev"
  port = 5173

# Environment variables for Supabase
[build.environment]
  NODE_ENV = "production"
  # Ensure devDependencies (e.g. vite) are installed during CI build
  NPM_CONFIG_PRODUCTION = "false"
  # Prefer Node 20 for compatibility with esbuild and dependencies
  NODE_VERSION = "20"

# Redirects for SPA routing - catch all undefined routes and rewrite to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  condition = { Status = "404", NOT = { path = "/api/*" } }

# API routes - do not redirect
[[redirects]]
  from = "/api/*"
  status = 200

# Preload critical assets
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "application/manifest+json"

# Service Worker
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"
